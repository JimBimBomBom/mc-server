services:
  mc:
    image: itzg/minecraft-server:latest
    container_name: mc-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"
      VERSION: "26.1.2"
      MEMORY: "8G"
      MODE: "survival"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "FALSE"
      ENABLE_COMMAND_BLOCK: "true"
      MAX_PLAYERS: 20
      MOTD: "Minecraft 26.1.2 Modded Server"
      DIFFICULTY: "normal"
      RCON_PASSWORD: "minecraft"
      # Automatically remove old mod versions when updating
      REMOVE_OLD_MODS: "true"
    volumes:
      - ./data:/data
      - ./mods:/data/mods
    restart: unless-stopped
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      timeout: 5s
      retries: 20

  backups:
    image: itzg/mc-backup:latest
    container_name: mc-backups
    environment:
      BACKUP_INTERVAL: "30m"
      INITIAL_DELAY: "5m"
      BACKUP_METHOD: "tar"
      PRUNE_BACKUPS_DAYS: 7
      RCON_HOST: mc
      RCON_PASSWORD: "minecraft"
      SERVER_HOST: mc
      PAUSE_IF_NO_PLAYERS: "false"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    restart: unless-stopped
    depends_on:
      mc:
        condition: service_healthy
